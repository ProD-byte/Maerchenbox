; Maerchenbox: Spieluhr-Filme (zuerst "Das tapfere Schneiderlein")
; auf dem Xiaozhi-Board "ostb-2st-wifi-double-mic" (ESP32-S3, 16 MB Flash, ES8311, NV3023-Display).
; Pins: siehe README.md. Die Maerchen sind Programmcode (src/*.cpp), zwei Programmplaetze je 7,9 MB.
;
; WLAN wird per Handy eingerichtet (WLAN "Märchenbox-Setup").
; Das Update-Passwort kommt aus der geheim.ini der Himmelsstation (gleiches Passwort).

[platformio]
default_envs = ostb2st_wlan
extra_configs = ../Himmelsstation/geheim.ini

[env:ostb2st]
platform = platformio/espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_upload.maximum_size = 8323072
board_build.flash_mode = dio
board_build.partitions = partitionen.csv

upload_port = COM16
monitor_port = COM16
monitor_speed = 115200


build_unflags = -Os
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel). Das allererste Mal per USB (env:ostb2st).
; Klappt "maerchenbox.local" nicht, hier die IP-Adresse eintragen.
; Neue Speicheraufteilung (partitionen.csv) geht nur per USB: pio run -e ostb2st -t upload
; ------------------------------------------------------------
[env:ostb2st_wlan]
extends = env:ostb2st
upload_protocol = espota
upload_port = maerchenbox.local
upload_flags =
    --auth=${geheim.ota_passwort}
